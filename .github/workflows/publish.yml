name: Publish

on:
  release:
    types: [published]

# No job gets more than it needs: tests run with a read-only token, and the
# OIDC token for provenance exists only in the publish job, after the tree
# has been installed without running dependency install scripts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
      # The published files are plain sources; nothing needs install scripts here.
      - run: npm ci --ignore-scripts
      - run: npm pack --dry-run
      # NPM_TOKEN is the fallback until npm trusted publishing is configured for
      # this repository on npmjs.com; once it is, delete the secret and the env
      # line below, and npm publish will authenticate with the OIDC token alone.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
