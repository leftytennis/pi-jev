name: Publish

on:
  release:
    types: [published]

# No job gets more than it needs: tests run with a read-only token, and the
# OIDC token for provenance exists only in the publish job, after the tree
# has been installed without running dependency install scripts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing requires npm >=11.5.1 and Node >=22.14.
      - run: npm install --global npm@11.5.1 --ignore-scripts
      # The published files are plain sources; nothing needs install scripts here.
      - run: npm ci --ignore-scripts
      - run: npm pack --dry-run
      # Configure the package's trusted publisher for leftytennis/pi-jev,
      # publish.yml, environment npm-publish. No stored publish token is used.
      - run: npm publish --provenance --access public
